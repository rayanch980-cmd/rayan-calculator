
<!DOCTYPE html>
<html>
<head>
    <title>My Calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background-color: #eee6ff;
        }

        .calculator {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border: 2px solid #b69aff;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border: 1px solid #b69aff;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
            background-color: #b69aff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #8d6bd1;
        }

        h2 {
            color: #7650b5;
        }

        h3 {
            color: #7650b5;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Simple Calculator</h2>

        <input type="number" id="num1"
        placeholder="Enter first number">

        <input type="number" id="num2"
        placeholder="Enter second number">

        <br>

        <button onclick="add()">Add (+)</button>

        <button onclick="subtract()">Subtract (-)</button>

        <button onclick="multiply()">Multiply (*)</button>

        <h3 id="result">Result: </h3>

    </div>

    <script>
        function add() {
            var a = Number(document.getElementById("num1").value);
            var b = Number(document.getElementById("num2").value);

            var sum = a + b;

            document.getElementById("result").innerHTML = "Result: " + sum;
        }

        function subtract() {
            var a = Number(document.getElementById("num1").value);
            var b = Number(document.getElementById("num2").value);

            var difference = a - b;

            document.getElementById("result").innerHTML = "Result: " + difference;
        }

        function multiply() {
            var a = Number(document.getElementById("num1").value);
            var b = Number(document.getElementById("num2").value);

            var product = a * b;

            document.getElementById("result").innerHTML = "Result: " + product;
        }
    </script>

</body>
</html>
